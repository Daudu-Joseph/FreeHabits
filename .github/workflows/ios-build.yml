name: Free personal iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    name: Build local-only FreeHabits IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode and project schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project FreeHabits.xcodeproj

      - name: Archive local-only iOS app (unsigned)
        run: |
          xcodebuild archive \
            -project FreeHabits.xcodeproj \
            -scheme FreeHabits \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FreeHabits.xcarchive" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=FREE_PERSONAL_INSTALL \
            CODE_SIGN_ENTITLEMENTS=FreeHabits/WidgetApp.entitlements \
            DEVELOPMENT_TEAM= \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA for AltServer signing
        run: |
          APP_PATH="$RUNNER_TEMP/FreeHabits.xcarchive/Products/Applications/FreeHabits.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/freehabits-ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/freehabits-ipa/Payload/FreeHabits.app"
          # AltStore Classic does not fully provision/sign embedded Watch apps.
          # Package only the iPhone app for this personal sideload build.
          rm -rf "$RUNNER_TEMP/freehabits-ipa/Payload/FreeHabits.app/Watch"
          (cd "$RUNNER_TEMP/freehabits-ipa" && zip -qry "$RUNNER_TEMP/FreeHabits-personal-unsigned.ipa" Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FreeHabits-personal-unsigned-IPA
          path: ${{ runner.temp }}/FreeHabits-personal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
